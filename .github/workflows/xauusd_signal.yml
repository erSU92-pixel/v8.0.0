name: XAUUSD Signal Bot v9

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

concurrency:
  group: xauusd-signal
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # Dinaikkan karena MetaApi butuh waktu connect

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --no-cache-dir --quiet -r requirements.txt

      - name: Verify required files
        run: |
          MISSING=""
          for f in bot.py optimizer.py news_calendar.py fuzzy_regime.py \
                   kelly.py supabase_client.py requirements.txt; do
            if [ ! -f "$f" ]; then
              echo "❌ MISSING: $f"
              MISSING="$MISSING $f"
            else
              echo "✅ $f"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo ""
            echo "❌ MISSING FILES:$MISSING"
            exit 1
          fi

      - name: Verify imports
        run: |
          python -c "
          import sys
          try:
              from bot import main, is_holiday, is_market_open, VERSION
              from news_calendar import NewsResult, check_news_guard
              from fuzzy_regime import membership, blend_params, dominant
              from kelly import kelly_fraction, risk_pct_from_env
              from supabase_client import SUPABASE, try_insert_signal
              print(f'✅ All imports OK (v{VERSION})')
              print(f'   Supabase enabled: {SUPABASE.enabled}')
          except Exception as e:
              print(f'❌ Import failed: {type(e).__name__}: {e}')
              sys.exit(1)
          "

      - name: Restore persistent cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/quant_audit.db
            data/news_cache.json
          key: bot-cache-${{ github.run_id }}
          restore-keys: |
            bot-cache-

      - name: Run signal bot
        env:
          TWELVE_DATA_API_KEY:  ${{ secrets.TWELVE_DATA_API_KEY }}
          TELEGRAM_BOT_TOKEN:   ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:     ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY:         ${{ secrets.SUPABASE_KEY }}
          
          ACCOUNT_SIZE_USD:     ${{ vars.ACCOUNT_SIZE_USD || '1000' }}
          RISK_PCT:             ${{ vars.RISK_PCT || '1.0' }}
          MAX_LOT_RISK_PCT:     ${{ vars.MAX_LOT_RISK_PCT || '2.5' }}
          
          # === METAAPI VARIABEL ===
          EXECUTE_TRADES:       ${{ vars.EXECUTE_TRADES || '0' }}
          METAAPI_TOKEN:        ${{ secrets.METAAPI_TOKEN }}
          MT5_LOGIN:            ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD:         ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER:           ${{ secrets.MT5_SERVER }}
          MT5_SYMBOL:           ${{ vars.MT5_SYMBOL || 'XAUUSD' }}
        run: python bot.py

      - name: Save persistent cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/quant_audit.db
            data/news_cache.json
          key: bot-cache-${{ github.run_id }}
